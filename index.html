<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسابقة توقع كأس العالم</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap');

  :root{
    --bg-base:#061b10;
    --bg-panel:rgba(12, 41, 24, 0.94);
    --text:#f6f2e8;
    --muted:#8aa39d;
    --accent:#00b3ac;
    --accent-strong:#6fe1de;
    --danger:#e79b9b;
  }

  *{box-sizing:border-box;}
  body{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    background:radial-gradient(circle at top center, rgba(0,179,172,0.12), transparent 24%),
                linear-gradient(180deg, #063b3a 0%, #061b10 40%, #04160d 100%);
    color:var(--text);
    margin:0;
    padding:40px 20px;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .container{
    max-width:800px;
    text-align:center;
  }

  h1{
    font-family:'Fraunces', serif;
    font-size:48px;
    font-weight:700;
    margin:0 0 16px;
    color:var(--accent-strong);
  }

  .subtitle{
    font-size:18px;
    color:var(--muted);
    margin-bottom:60px;
  }

  .links-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
    gap:20px;
    margin-top:40px;
  }

  a{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px 20px;
    background:var(--bg-panel);
    border-radius:16px;
    border:2px solid rgba(0,179,172,0.3);
    text-decoration:none;
    transition:all 0.3s ease;
    min-height:200px;
    box-shadow:0 18px 40px rgba(0,0,0,0.22);
  }

  a:hover{
    border-color:var(--accent);
    background:rgba(0,179,172,0.1);
    transform:translateY(-4px);
    box-shadow:0 24px 50px rgba(0,179,172,0.2);
  }

  a .icon{
    font-size:48px;
    margin-bottom:16px;
  }

  a .title{
    font-family:'Fraunces', serif;
    font-size:22px;
    font-weight:700;
    color:var(--accent);
    margin:0;
  }

  a .desc{
    font-size:14px;
    color:var(--muted);
    margin-top:8px;
  }

  .logo-section{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-bottom:40px;
  }

  .logo-section img{
    width:100px;
    height:auto;
    object-fit:contain;
  }

  @media (max-width:600px){
    h1{ font-size:32px; }
    .subtitle{ font-size:15px; }
    .links-grid{ grid-template-columns:1fr; }
    a{ min-height:160px; padding:20px; }
    .logo-section{ flex-direction:column; gap:15px; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>مسابقة توقع كأس العالم</h1>
  <p class="subtitle">توقع النتيجة واربح جوائز رائعة!</p>

  <div class="logo-section">
    <img src="assets/16-1772013159.png" alt="FIFA World Cup">
    <img src="assets/igs-logo.png" alt="IGS Electronics">
  </div>

  <div class="links-grid">
    <a href="prediction-app.html" class="link">
      <div class="icon">📝</div>
      <div class="title">سجّل توقعك</div>
      <div class="desc">أدخل توقعك للمباراة</div>
    </a>

    <a href="raffle.html" class="link">
      <div class="icon">🎰</div>
      <div class="title">سحب القرعة</div>
      <div class="desc">شاهد اختيار الفائز</div>
    </a>

    <a href="admin.html" class="link">
      <div class="icon">⚙️</div>
      <div class="title">لوحة التحكم</div>
      <div class="desc">إدارة المسابقة</div>
    </a>
  </div>
</div>

</body>
</html>
