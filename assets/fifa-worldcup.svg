<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <!-- كأس ذهبي -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffed4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- كأس -->
  <ellipse cx="100" cy="60" rx="35" ry="45" fill="url(#goldGradient)" stroke="#c9a227" stroke-width="2"/>
  <path d="M 70 50 Q 60 70 65 100 L 135 100 Q 140 70 130 50" fill="url(#goldGradient)" stroke="#c9a227" stroke-width="2"/>
  <ellipse cx="100" cy="100" rx="35" ry="20" fill="url(#goldGradient)" stroke="#c9a227" stroke-width="2"/>
  
  <!-- المقابض -->
  <path d="M 140 70 Q 160 80 165 100" fill="none" stroke="url(#goldGradient)" stroke-width="8"/>
  <path d="M 60 70 Q 40 80 35 100" fill="none" stroke="url(#goldGradient)" stroke-width="8"/>
  
  <!-- القاعدة الخضراء -->
  <rect x="60" y="100" width="80" height="20" rx="4" fill="#1b5e3f" stroke="#0d3d23" stroke-width="2"/>
  <text x="100" y="113" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">WORLD CUP</text>
  
  <!-- كلمة FIFA -->
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="#000" text-anchor="middle">FIFA</text>
</svg>
