<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرعة — مسابقة التوقع</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --bg-base:#061b10;
    --bg-panel:rgba(12, 41, 24, 0.94);
    --bg-soft:#0c3a1f;
    --text:#f6f2e8;
    --muted:#8aa39d;
    --accent:#00b3ac;
    --accent-strong:#6fe1de;
    --gold:#00b3ac;
    --danger:#e79b9b;
    --border:#117d77;
    --field:#0f312f;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    background:radial-gradient(circle at top center, rgba(0,179,172,0.12), transparent 24%),
                linear-gradient(180deg, #063b3a 0%, #061b10 40%, #04160d 100%);
    color:var(--text);
    margin:0;
    padding:28px 20px 40px;
    min-height:100vh;
  }
  body::before{
    content:'';
    position:fixed;
    inset:0;
    background-image:radial-gradient(circle at 20% 10%, rgba(0,179,172,0.05), transparent 18%),
                      linear-gradient(0deg, rgba(255,255,255,0.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 20px 20px, 40px 40px, 40px 40px;
    pointer-events:none;
    z-index:-1;
  }
  .wrap{ max-width:100%; margin:0 auto; }
  .main-layout{ display:flex; align-items:center; justify-content:center; gap:40px; margin-top:20px; }
  .logo-side{ display:flex; align-items:center; justify-content:center; flex:0 0 280px; min-height:600px; }
  .logo-side img{ width:280px; height:auto; object-fit:contain; }
  .form-center{ flex:0 0 400px; }
  .brand-bar{ display:none; }
  h1{
    font-family:'Fraunces', serif; font-weight:700; font-size:30px;
    text-align:center; margin:0 0 4px;
  }
  .sub{ text-align:center; color:var(--muted); font-size:14px; margin-bottom:26px; }

  .card{
    background:var(--bg-panel);
    border-radius:16px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 18px 40px rgba(0,0,0,0.22);
  }
  .card h2{
    font-family:'Fraunces', serif; font-size:18px; font-weight:600;
    color:var(--accent); margin:0 0 16px; text-align:center;
  }
  select{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(81, 152, 95, 0.25);
    background:rgba(19, 65, 35, 0.82); color:var(--text); font-size:15px; margin-bottom:6px;
    font-family:inherit;
  }
  select option{ background:var(--bg-panel); color:var(--text); }

  .meta{ text-align:center; font-size:13px; color:var(--muted); margin-bottom:18px; }
  .meta b{ color:var(--accent); }

  .count-badge{
    text-align:center; margin-bottom:20px;
  }
  .count-badge .num{
    font-family:'Fraunces', serif; font-weight:700; font-size:56px; color:var(--accent-strong);
    line-height:1;
  }
  .count-badge .label{ font-size:14px; color:var(--muted); margin-top:4px; }

  .pool{ margin-bottom:18px; }
  .pool-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 4px; border-bottom:1px solid rgba(0, 179, 172, 0.16);
    font-size:14px;
  }
  .pool-item:last-child{ border-bottom:none; }
  .pool-item .phone{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--muted); direction:ltr; }
  .empty{ text-align:center; color:var(--muted); font-size:13px; padding:16px 0; }

  button{
    width:100%; padding:14px; border:none; border-radius:10px;
    background:linear-gradient(135deg, var(--accent), var(--accent-strong)); color:var(--bg-base); font-weight:700; font-size:16px;
    font-family:inherit; cursor:pointer; box-shadow:0 14px 30px rgba(0,179,172,0.22);
  }
  button:active{ transform:scale(0.99); }
  button:disabled{ opacity:0.45; cursor:not-allowed; }
  button.secondary{
    background:transparent; border:1px solid rgba(0,179,172,0.35); color:var(--text);
    margin-top:10px; font-weight:500; font-size:13px;
  }

  .stage{
    text-align:center; padding:48px 16px; border-radius:14px;
    background:rgba(0,179,172,0.08); margin-bottom:18px;
    min-height:90px; display:flex; align-items:center; justify-content:center;
  }
  .stage .rolling{
    font-family:'IBM Plex Mono', monospace; font-size:24px; color:var(--text); opacity:0.7;
  }
  .stage .winner-name{
    font-family:'Fraunces', serif; font-weight:700; font-size:38px; color:var(--accent);
  }
  .stage .winner-phone{
    font-family:'IBM Plex Mono', monospace; font-size:16px; color:var(--text);
    direction:ltr; margin-top:8px;
  }
  .stage .placeholder{ font-size:14px; color:var(--muted); }
  .stage .countdown-num{
    font-family:'Fraunces', serif; font-weight:700; font-size:72px; color:var(--accent);
  }
  .stage .ready-label{ font-size:14px; color:var(--muted); margin-top:6px; }
  #confettiCanvas{
    position:fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:999;
  }

  .lock-screen{
    max-width:340px; margin:80px auto 0;
    background:var(--bg-panel); border-radius:16px; padding:28px;
    text-align:center;
    box-shadow:0 18px 40px rgba(0,0,0,0.24);
  }
  .lock-screen h2{
    font-family:'Fraunces', serif; font-size:20px; font-weight:600;
    color:var(--accent); margin:0 0 6px;
  }
  .lock-screen p{ font-size:13px; color:var(--muted); margin:0 0 18px; }
  .lock-screen input{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(81, 152, 95, 0.25);
    background:rgba(19, 65, 35, 0.82); color:var(--text); font-size:15px; margin-bottom:12px;
    font-family:inherit; text-align:center;
  }
  .msg{ text-align:center; font-size:13px; margin-top:10px; min-height:16px; }
  .msg.ok{ color:var(--accent-strong); }
  .msg.err{ color:var(--danger); }

  /* Responsive Mobile */
  @media (max-width:768px){
    body{ padding:16px 12px 30px; }
    .wrap{ max-width:100%; }
    h1{ font-size:22px; }
    .sub{ font-size:13px; margin-bottom:18px; }
    
    .main-layout{
      flex-direction:column; gap:12px; margin-top:12px; align-items:center;
    }
    .form-center{
      flex:1; width:100%; max-width:100%;
    }
    .main-layout > .logo-side{
      flex:0 0 auto; min-height:auto; width:140px; height:140px;
    }
    .main-layout > .logo-side img{
      width:140px !important;
    }
    
    .card{ padding:16px; margin-bottom:14px; }
    .card h2{ font-size:16px; margin-bottom:12px; }
    
    select{ font-size:14px; padding:9px 10px; }
    .meta{ font-size:12px; }
    
    .count-badge .num{ font-size:42px; }
    .count-badge .label{ font-size:13px; }
    
    .pool-item{ font-size:13px; padding:6px 0; }
    
    .stage{
      padding:32px 12px; min-height:70px; margin-bottom:14px;
    }
    .stage .countdown-num{ font-size:56px; }
    .stage .winner-name{ font-size:28px; }
    .stage .winner-phone{ font-size:13px; }
    .stage .placeholder{ font-size:12px; }
    
    button{
      padding:12px; font-size:15px;
    }
  }
</style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>
<div class="lock-screen" id="lockScreen">
  <h2>سحب القرعة</h2>
  <p>هاي الصفحة محمية، أدخل كلمة السر للمتابعة</p>
  <input type="password" id="passwordInput" placeholder="كلمة السر">
  <button id="unlockBtn">دخول</button>
  <div class="msg" id="lockMsg"></div>
</div>

<div class="wrap" id="mainContent" style="display:none;">
  <h1 style="text-align:center;">سحب القرعة 🎉</h1>
  
  <div class="main-layout">
    <!-- شعار على اليسار -->
    <div class="logo-side" dir="ltr">
      <img src="assets/igs-logo.png" alt="شعار IGS Electronics">
    </div>
    
    <!-- المحتوى في المنتصف -->
    <div class="form-center">

  <div class="card">
    <h2>اختر المباراة</h2>
    <select id="matchSelect"></select>
    <div class="meta" id="matchMeta">—</div>
  </div>

  <div class="count-badge">
    <div class="num" id="qualifierCount">0</div>
    <div class="label">شخص توقع النتيجة صح</div>
  </div>

  <div class="card">
    <h2>المتأهلين للقرعة</h2>
    <div class="pool" id="pool"><div class="empty">اختر مباراة أولاً</div></div>
  </div>

  <div class="card">
    <div class="stage" id="stage"><span class="placeholder">اضغط اسحب الفائز لما تكون جاهز</span></div>
    <button id="drawBtn">اسحب الفائز</button>
    <button class="secondary" id="redrawBtn" style="display:none;">أعد السحب</button>
  </div>
    </div>
    
    <!-- شعار على اليمين -->
    <div class="logo-side" dir="rtl">
      <img src="assets/16-1772013159.png" alt="شعار FIFA كأس العالم">
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// عدّل هالقيمتين من Settings > API بمشروع Supabase تبعك (نفس القيم يلي بصفحتي الزبائن والأدمن)
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
let sb = null;

function initSupabase() {
  if (SUPABASE_URL.startsWith('http://') || SUPABASE_URL.startsWith('https://')) {
    try {
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (error) {
      console.error('Supabase init error', error);
      sb = null;
    }
  } else {
    sb = null;
  }
}

function storageKey(key){
  return 'wc-local-' + key;
}

async function kvGet(key){
  if(sb){
    const { data, error } = await sb.from('wc_kv').select('v').eq('k', key).maybeSingle();
    if(error || !data) return null;
    return data.v;
  }
  try {
    const raw = localStorage.getItem(storageKey(key));
    return raw ? JSON.parse(raw) : null;
  } catch (error) {
    console.error('localStorage read error', error);
    return null;
  }
}
async function kvSet(key, value){
  if(sb){
    const { error } = await sb.from('wc_kv').upsert({ k: key, v: value });
    if(error) console.error('supabase error', error);
    return;
  }
  try {
    localStorage.setItem(storageKey(key), JSON.stringify(value));
  } catch (error) {
    console.error('localStorage write error', error);
  }
}

// غيّر كلمة السر هون لأي شي تختاره
const RAFFLE_PASSWORD = '1234';

function checkAuth(){
  if(sessionStorage.getItem('wc-raffle-auth') === 'true'){
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    return true;
  }
  return false;
}

document.getElementById('unlockBtn').addEventListener('click', async () => {
  const entered = document.getElementById('passwordInput').value;
  const msg = document.getElementById('lockMsg');
  if(entered === RAFFLE_PASSWORD){
    sessionStorage.setItem('wc-raffle-auth', 'true');
    checkAuth();
    initSupabase();
    await init();
  }else{
    msg.textContent = 'كلمة السر غلط';
    msg.className = 'msg err';
  }
});
document.getElementById('passwordInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') document.getElementById('unlockBtn').click();
});

let matchList = [];
let selectedId = null;
let pool = [];
let rollTimer = null;

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function maskPhone(phone){
  const cleaned = (phone || '').replace(/[\s-]/g, '');
  if(cleaned.length < 4) return '****';
  return '****' + cleaned.slice(-3);
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTick(freq){
  try{
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq || 180;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.08);
  }catch(e){}
}
function playWinSound(){
  try{
    const ctx = getAudioCtx();
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const start = ctx.currentTime + i * 0.11;
      gain.gain.setValueAtTime(0.001, start);
      gain.gain.linearRampToValueAtTime(0.2, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.4);
    });
  }catch(e){}
}

const confettiColors = ['#00b3ac', '#6fe1de', '#8caa6c', '#0f3d1c'];
function launchConfetti(){
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const pieces = [];
  for(let i = 0; i < 120; i++){
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height * 0.3,
      vx: (Math.random() - 0.5) * 3,
      vy: 2 + Math.random() * 3,
      size: 5 + Math.random() * 6,
      color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
      rotation: Math.random() * 360,
      vr: (Math.random() - 0.5) * 10
    });
  }

  let frames = 0;
  const maxFrames = 220;
  function tick(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    });
    frames++;
    if(frames < maxFrames){
      requestAnimationFrame(tick);
    }else{
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  tick();
}

async function loadMatchList(){
  const v = await kvGet('wc-match-list');
  return v || [];
}
async function loadEntries(id){
  const v = await kvGet('wc-entries:' + id);
  return v || [];
}
async function loadResult(id){
  return await kvGet('wc-result:' + id);
}
async function loadDraw(id){
  return await kvGet('wc-draw:' + id);
}
async function saveDraw(id, draw){
  await kvSet('wc-draw:' + id, draw);
}

async function init(){
  matchList = await loadMatchList();
  const select = document.getElementById('matchSelect');
  if(matchList.length === 0){
    select.innerHTML = '<option>ما في مباريات بعد</option>';
    return;
  }
  select.innerHTML = matchList.slice().reverse().map(m =>
    `<option value="${m.id}">${escapeHtml(m.home)} 🆚 ${escapeHtml(m.away)}</option>`
  ).join('');
  selectedId = select.value;
  select.addEventListener('change', () => {
    selectedId = select.value;
    loadSelected();
  });
  await loadSelected();
}

async function loadSelected(){
  resetStage();
  const [entries, result, draw] = await Promise.all([
    loadEntries(selectedId), loadResult(selectedId), loadDraw(selectedId)
  ]);

  const metaEl = document.getElementById('matchMeta');
  if(!result){
    metaEl.innerHTML = 'لسا ما تم إدخال النتيجة الفعلية لهاي المباراة';
    pool = [];
  }else{
    metaEl.innerHTML = `النتيجة الفعلية: <b>${result.bra} — ${result.nor}</b>`;
    pool = entries.filter(e => Number(e.bra) === Number(result.bra) && Number(e.nor) === Number(result.nor));
  }
  document.getElementById('qualifierCount').textContent = pool.length;
  renderPool();

  document.getElementById('drawBtn').disabled = pool.length === 0;

  if(draw){
    showWinner(draw, false);
  }
}

function renderPool(){
  const poolEl = document.getElementById('pool');
  if(pool.length === 0){
    poolEl.innerHTML = '<div class="empty">ما في حدا توقع النتيجة بالضبط لهاي المباراة</div>';
    return;
  }
  poolEl.innerHTML = pool.map(e => `
    <div class="pool-item">
      <span>${escapeHtml(e.name)}</span>
      <span class="phone">${maskPhone(e.phone)}</span>
    </div>
  `).join('');
}

function resetStage(){
  clearInterval(rollTimer);
  document.getElementById('stage').innerHTML = '<span class="placeholder">اضغط اسحب الفائز لما تكون جاهز</span>';
  document.getElementById('redrawBtn').style.display = 'none';
}

function showWinner(winner, animated){
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div>
      <div class="winner-name">${escapeHtml(winner.name)}</div>
      <div class="winner-phone">${maskPhone(winner.phone)}</div>
    </div>
  `;
  document.getElementById('redrawBtn').style.display = 'block';
}

document.getElementById('drawBtn').addEventListener('click', async () => {
  if(pool.length === 0) return;
  runDraw();
});

document.getElementById('redrawBtn').addEventListener('click', async () => {
  if(!confirm('متأكد إنك بدك تعيد السحب؟ الفائز الحالي رح يتغيّر')) return;
  runDraw();
});

async function runDraw(){
  const stage = document.getElementById('stage');
  document.getElementById('drawBtn').disabled = true;
  document.getElementById('redrawBtn').style.display = 'none';
  document.getElementById('matchSelect').disabled = true;

  // شاشة الاستعداد
  stage.innerHTML = `<div><div class="winner-name" style="font-size:22px;">استعد! 🎬</div><div class="ready-label">${pool.length} شخص بالقرعة</div></div>`;
  await sleep(900);

  // العد التنازلي 3-2-1
  for(const n of [3, 2, 1]){
    stage.innerHTML = `<div class="countdown-num">${n}</div>`;
    playTick(140 + n * 60);
    await sleep(600);
  }

  // طبلة التشويق مع الأسماء وهي تلف
  let ticks = 0;
  const maxTicks = 22;
  await new Promise(resolve => {
    rollTimer = setInterval(() => {
      const random = pool[Math.floor(Math.random() * pool.length)];
      stage.innerHTML = `<span class="rolling">${escapeHtml(random.name)}</span>`;
      playTick(160 + ticks * 4);
      ticks++;
      if(ticks >= maxTicks){
        clearInterval(rollTimer);
        resolve();
      }
    }, 90);
  });

  // كشف الفائز
  const finalWinner = pool[Math.floor(Math.random() * pool.length)];
  showWinner(finalWinner, true);
  playWinSound();
  launchConfetti();
  saveDraw(selectedId, finalWinner);
  document.getElementById('drawBtn').disabled = false;
  document.getElementById('matchSelect').disabled = false;
}

initSupabase();
if(checkAuth()){
  init();
}
</script>
</body>
</html>
